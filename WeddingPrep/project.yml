name: WeddingPrep
options:
  bundleIdPrefix: com.weddingprep
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  WeddingPrep:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Models
      - path: Theme
      - path: Components
      - path: Views
      - path: Utils
      - path: Assets.xcassets
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 备婚总览
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSUserNotificationsUsageDescription: 用于发送任务到期提醒和婚礼倒计时通知
        NSPhotoLibraryUsageDescription: 用于保存商家合同照片和物品参考图
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.weddingprep.backup
            UTTypeDescription: 备婚总览备份文件
            UTTypeConformsTo:
              - public.json
            UTTypeTagSpecification:
              public.filename-extension:
                - wpbackup
    settings:
      base:
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.weddingprep.app
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
